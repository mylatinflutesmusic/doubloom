<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">The 80-byte Doubloom block header and its merkle root</title>
  <desc id="fig2-desc">The header contains a 4-byte version, a 32-byte previous block hash, a 32-byte merkle root, a 4-byte time, a 4-byte difficulty target and a 4-byte nonce. The merkle root is computed from the block's transaction ids, so the header commits to every transaction and the proof-of-work secures all of them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#14110c"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6b6459"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Times New Roman", Times, serif; fill: #14110c; }
    .hlabel { font-size: 11.5px; fill: #6b6459; letter-spacing: 0.04em; }
    .field { font-size: 14px; }
    .narrow { font-size: 11px; }
    .bytes { font-size: 11px; fill: #6b6459; }
    .node { fill: #fff; stroke: #14110c; stroke-width: 1.1; }
    .leaf { fill: #f7f4ec; stroke: #14110c; stroke-width: 1.1; }
    .mono { font-family: "Courier New", Courier, monospace; font-size: 12px; }
    .note { font-size: 12px; fill: #4b463d; }
    .edge { stroke: #14110c; stroke-width: 1; fill: none; }
    .dash { stroke: #6b6459; stroke-width: 1; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow-muted); }
  </style>

  <text class="hlabel" x="20" y="44">80-BYTE HEADER</text>
  <text class="hlabel" x="700" y="44" text-anchor="end">SHA-256d(HEADER) ≤ TARGET</text>

  <!-- Header bar: 80 bytes at 8.5 px per byte -->
  <rect x="20" y="58" width="680" height="54" fill="#fff" stroke="#14110c" stroke-width="1.3"/>
  <path d="M54 58 V112 M326 58 V112 M598 58 V112 M632 58 V112 M666 58 V112" stroke="#14110c" stroke-width="1"/>

  <text class="field narrow" x="37" y="81" text-anchor="middle">ver</text>
  <text class="bytes" x="37" y="98" text-anchor="middle">4</text>

  <text class="field" x="190" y="81" text-anchor="middle">previous block hash</text>
  <text class="bytes" x="190" y="98" text-anchor="middle">32 bytes</text>

  <text class="field" x="462" y="81" text-anchor="middle">merkle root</text>
  <text class="bytes" x="462" y="98" text-anchor="middle">32 bytes</text>

  <text class="field narrow" x="613" y="81" text-anchor="middle">time</text>
  <text class="bytes" x="615" y="98" text-anchor="middle">4</text>

  <text class="field narrow" x="648" y="81" text-anchor="middle">bits</text>
  <text class="bytes" x="649" y="98" text-anchor="middle">4</text>

  <text class="field narrow" x="680" y="81" text-anchor="middle" style="font-size:10px">nonce</text>
  <text class="bytes" x="683" y="98" text-anchor="middle">4</text>

  <!-- Merkle root -->
  <path class="dash" d="M462 112 V136"/>
  <rect class="node" x="402" y="140" width="120" height="28" rx="2"/>
  <text class="mono" x="462" y="159" text-anchor="middle">merkle root</text>

  <!-- First level -->
  <path class="edge" d="M462 168 L357 196"/>
  <path class="edge" d="M462 168 L577 196"/>
  <rect class="node" x="307" y="196" width="100" height="26" rx="2"/>
  <text class="mono" x="357" y="214" text-anchor="middle">H(ab)</text>
  <rect class="node" x="527" y="196" width="100" height="26" rx="2"/>
  <text class="mono" x="577" y="214" text-anchor="middle">H(cd)</text>

  <!-- Leaves -->
  <path class="edge" d="M357 222 L302 250"/>
  <path class="edge" d="M357 222 L412 250"/>
  <path class="edge" d="M577 222 L522 250"/>
  <path class="edge" d="M577 222 L632 250"/>

  <rect class="leaf" x="252" y="250" width="100" height="24" rx="2"/>
  <text class="mono" x="302" y="266" text-anchor="middle">txid a</text>
  <rect class="leaf" x="362" y="250" width="100" height="24" rx="2"/>
  <text class="mono" x="412" y="266" text-anchor="middle">txid b</text>
  <rect class="leaf" x="472" y="250" width="100" height="24" rx="2"/>
  <text class="mono" x="522" y="266" text-anchor="middle">txid c</text>
  <rect class="leaf" x="582" y="250" width="100" height="24" rx="2"/>
  <text class="mono" x="632" y="266" text-anchor="middle">txid d</text>

  <text class="note" x="462" y="300" text-anchor="middle">each parent is SHA-256d(left ∥ right); an odd node is paired with itself</text>
</svg>
